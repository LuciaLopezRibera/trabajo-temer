  <link rel="icon" href="../../img/logo_icono.jpg" type="image/jpeg">
  <link rel="stylesheet" href="../../estilos.css">
  <link rel="stylesheet" href="../css/frutas.css">
</head>
<body>

  <!-- ===== MENÚ LATERAL DEL PORTAL ===== -->
  <nav class="portal">
    <a href="../../Lucia/html/estado.html">Estado</a>
    <a href="../../Lucia/html/camaras.html">Cámaras</a>
    <a href="frutas.html" class="activa">Cultivos</a>

  <div class="contenido">
    <header>
      <img src="../../img/logo_icono.jpg" alt="">
      <h1><img src="../../img/logo_texto.jpg" alt="miHuertapp"></h1>
    </header>

    <main>
      <h2>Guía de cultivos</h2>

      <div class="filtros">
        <label>Tipo:
          <select id="filtro-tipo" onchange="mostrarCultivos()">
            <option value="todos">Todos</option>
            <option value="fruta">Frutas</option>
            <option value="verdura">Verduras</option>
          </select>
        </label>

        <label>Color:
          <select id="filtro-color" onchange="mostrarCultivos()">
            <option value="todos">Todos</option>
            <option value="rojo">Rojo</option>
            <option value="naranja">Naranja</option>
            <option value="amarillo">Amarillo</option>
            <option value="verde">Verde</option>
            <option value="morado">Morado</option>
            <option value="blanco">Blanco</option>
          </select>
        </label>

        <label>Temporada:
          <select id="filtro-temporada" onchange="mostrarCultivos()">
            <option value="todas">Todas</option>
            <option value="primavera">Primavera</option>
            <option value="verano">Verano</option>
            <option value="otonyo">Otoño</option>
            <option value="invierno">Invierno</option>
          </select>
        </label>

        <label>Orden:
          <select id="filtro-orden" onchange="mostrarCultivos()">
            <option value="az">A &rarr; Z</option>
            <option value="za">Z &rarr; A</option>
          </select>
        </label>




      </div>
    </main>

      <p>Atención al cliente: lunes a viernes, de 9:00 a 19:00</p>
    </footer>
  </div>

  <script src="../js/cultivos.js"></script>
  <script src="../js/frutas.js"></script>
</body>
</html>
