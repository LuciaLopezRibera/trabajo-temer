<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>miHuertapp - Frutas y verduras</title>
  <link rel="icon" href="../../img/logo_icono.jpg" type="image/jpeg">
  <link rel="stylesheet" href="../../estilos.css">
  <link rel="stylesheet" href="../css/frutas.css">
  <link rel="stylesheet" href="../../Lucia/css/aviso.css">
</head>
<body>

  <!-- ===== MENÚ LATERAL DEL PORTAL ===== -->
  <nav class="portal">
    <a href="../../Lucia/html/estado.html">Estado</a>
    <a href="../../Lucia/html/camaras.html">Cámaras</a>
    <a href="frutas.html" class="activa">Cultivos</a>
    <a href="../../Belen/html/miPortal.html" id="cerrar-sesion">Cerrar sesión</a>
  </nav>

  <div class="contenido">
    <header>
      <img src="../../img/logo_icono.jpg" alt="">
      <h1><img src="../../img/logo_texto.jpg" alt="miHuertapp"></h1>
      <p id="hola" class="saludo"></p>
    </header>

    <main>
      <h2>Guía de cultivos</h2>

      <div class="filtros">
        <label>Tipo:
          <select id="filtro-tipo" onchange="mostrarCultivos()">
            <option value="todos">Todos</option>
            <option value="Fruta">Frutas</option>
            <option value="Verdura">Verduras</option>
          </select>
        </label>

        <label>Color:
          <select id="filtro-color" onchange="mostrarCultivos()">
            <option value="todos">Todos</option>
            <option value="rojo">Rojo</option>
            <option value="naranja">Naranja</option>
            <option value="amarillo">Amarillo</option>
            <option value="verde">Verde</option>
            <option value="morado">Morado</option>
            <option value="blanco">Blanco</option>
          </select>
        </label>

        <label>Temporada:
          <select id="filtro-temporada" onchange="mostrarCultivos()">
            <option value="todas">Todas</option>
            <option value="primavera">Primavera</option>
            <option value="verano">Verano</option>
            <option value="otoño">Otoño</option>
            <option value="invierno">Invierno</option>
          </select>
        </label>

        <label>Orden:
          <select id="filtro-orden" onchange="mostrarCultivos()">
            <option value="az">A &rarr; Z</option>
            <option value="za">Z &rarr; A</option>
          </select>
        </label>




      </div>
      <div id="lista-cultivos" class="lista-cultivos"></div>
    </main>

    <footer>
      <p>&copy; 2026 miHuertapp. Todos los derechos reservados.</p>
      <p>Contacto: <a href="tel:+34642342442">+34 642 342 442</a></p>
      <p>Correo: <a href="mailto:info@mihuertapp.com">info@mihuertapp.com</a></p>
      <p>Atención al cliente: lunes a viernes, de 9:00 a 19:00</p>
    </footer>
  </div>

    <!-- Aviso de cerrar sesion (cuando se pulsa el boton, pregunta si estas seguro) -->
  <div id="aviso-cerrar" class="aviso-fondo">
    <div class="aviso-caja">
      <h2>Cerrar sesión</h2>
      <p>¿Seguro que quieres cerrar sesión?</p>
      <div class="aviso-botones">
        <a href="../../Belen/html/miPortal.html" class="aviso-si">Sí, cerrar sesión</a>
        <button id="aviso-no">No, volver</button>
      </div>
    </div>
  </div>

  <script src="../js/cultivos.js"></script>
  <script src="../js/frutas.js"></script>
</body>
</html>
